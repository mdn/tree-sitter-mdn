name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

# No GITHUB_TOKEN permissions, as we don't use it.
permissions: {}

jobs:
  test:
    name: Test parser
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    env:
      TREE_SITTER_ABI_VERSION: 14
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned tree-sitter CLI version
        id: cli
        shell: bash
        run: |
          version=$(jq -er '.packages["node_modules/tree-sitter-cli"].version' package-lock.json)
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@faab9a23fa6195da0f1cf868219cc1e89f238d3d # v2
        with:
          tree-sitter-ref: v${{ steps.cli.outputs.version }}

      # A `tree-sitter-cli` bump must come with the resulting `src/` diff.
      - name: Verify committed parser matches the pinned CLI
        shell: bash
        run: |
          tree-sitter generate
          git add --intent-to-add src
          git diff --exit-code -- src

      - name: Set up examples
        run: |-
          git clone https://github.com/mdn/content examples/content --single-branch --depth=1 --filter=blob:none
          git clone https://github.com/mdn/translated-content examples/translated-content --single-branch --depth=1 --filter=blob:none

      - name: Run tests
        uses: tree-sitter/parser-test-action@92e35c06b51ea26c80ffbd3cc8d9286d9110df17 # v3
        with:
          generate: false
          test-rust: true
          #test-node: true
          #test-python: true
          #test-go: true
          #test-swift: true

      - name: Parse examples
        uses: tree-sitter/parse-action@47beaa8ba0b5c8b44ef0879b2f647ca7f0a1257d # v5
        with:
          files: examples/mdn/*/files/**/*.md

  fuzz:
    name: Fuzz parser
    runs-on: ubuntu-latest
    env:
      TREE_SITTER_ABI_VERSION: 14
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run fuzzer
        uses: tree-sitter/fuzz-action@6a1dcff00aefd038ba418bd63732a9add4901266 # v4

  diff-package:
    name: Diff package
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (base)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          path: base
          persist-credentials: false

      # Release PRs only bump versions, so compare them against the last release instead.
      - name: Checkout last release
        if: startsWith(github.head_ref, 'release-please--')
        working-directory: base
        run: |
          version=$(jq -er '."."' .github/release-please-manifest.json)
          git fetch --quiet --depth=1 origin tag "v$version"
          git checkout --quiet --detach "v$version"
          echo "Comparing release branch against v$version"

      - name: Checkout (PR)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          persist-credentials: false

      - name: Package
        run: |
          for side in base pr; do
            (cd "$side" && cargo package --no-verify --quiet)
            mkdir "$side-crate"
            tar -xzf "$side"/target/package/*.crate -C "$side-crate" --strip-components=1
            # Not consumer-facing: VCS metadata, the raw manifest, and the lockfile (ignored by dependents).
            rm "$side-crate"/{.cargo_vcs_info.json,Cargo.toml.orig,Cargo.lock}
          done

      - name: Diff
        run: |
          git diff --color=always --no-index --stat --patch base-crate/ pr-crate/ || [ $? -eq 1 ]
          git diff --no-index --stat --patch base-crate/ pr-crate/ > package.diff || [ $? -eq 1 ]
          # Step summaries are capped at 1 MiB, which a regenerated `parser.c` can exceed.
          if [ "$(wc -c < package.diff)" -gt 1000000 ]; then
            git diff --no-index --stat base-crate/ pr-crate/ > package.diff || [ $? -eq 1 ]
            note="Patch too large for the summary, see the job log."
          fi
          {
            echo "## Package diff"
            if [ -s package.diff ]; then
              echo "${note:-}"
              echo '~~~~diff'
              cat package.diff
              echo '~~~~'
            else
              echo "No changes."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm

      - name: Install
        run: npm ci

      - name: Run ESLint
        run: npm run lint
