name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

# No GITHUB_TOKEN permissions, as we don't use it.
permissions: {}

jobs:
  test:
    name: Test parser
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    env:
      TREE_SITTER_ABI_VERSION: 14
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned tree-sitter CLI version
        id: cli
        shell: bash
        run: |
          version=$(jq -er '.packages["node_modules/tree-sitter-cli"].version' package-lock.json)
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@faab9a23fa6195da0f1cf868219cc1e89f238d3d # v2
        with:
          tree-sitter-ref: v${{ steps.cli.outputs.version }}

      # A `tree-sitter-cli` bump must come with the resulting `src/` diff.
      - name: Verify committed parser matches the pinned CLI
        shell: bash
        run: |
          tree-sitter generate
          git add --intent-to-add src
          git diff --exit-code -- src

      - name: Set up examples
        run: |-
          git clone https://github.com/mdn/content examples/content --single-branch --depth=1 --filter=blob:none
          git clone https://github.com/mdn/translated-content examples/translated-content --single-branch --depth=1 --filter=blob:none

      - name: Run tests
        uses: tree-sitter/parser-test-action@8e31a1fc364f0669ab091a3829ac961cce58033a # v3
        with:
          generate: false
          test-rust: true
          #test-node: true
          #test-python: true
          #test-go: true
          #test-swift: true

      - name: Parse examples
        uses: tree-sitter/parse-action@47beaa8ba0b5c8b44ef0879b2f647ca7f0a1257d # v5
        with:
          files: examples/mdn/*/files/**/*.md

  fuzz:
    name: Fuzz parser
    runs-on: ubuntu-latest
    env:
      TREE_SITTER_ABI_VERSION: 14
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run fuzzer
        uses: tree-sitter/fuzz-action@6a1dcff00aefd038ba418bd63732a9add4901266 # v4

  diff-package:
    name: Diff package
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Release PRs only bump versions, so compare them against the published crate instead.
      - name: Determine base ref
        id: base
        run: |
          if [[ "$GITHUB_HEAD_REF" == release-please--* ]]; then
            version=$(curl -fsS https://index.crates.io/tr/ee/tree-sitter-mdn | jq -ers 'map(select(.yanked | not)) | last | .vers')
            echo "ref=v$version" >> "$GITHUB_OUTPUT"
            echo "Comparing release branch against published v$version"
          else
            echo "ref=$GITHUB_BASE_REF" >> "$GITHUB_OUTPUT"
            echo "Comparing against base branch: $GITHUB_BASE_REF"
          fi

      - name: Checkout (base)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.base.outputs.ref }}
          path: base
          persist-credentials: false

      - name: Checkout (PR)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          persist-credentials: false

      - name: Package
        run: |
          for side in base pr; do
            (cd "$side" && cargo package --no-verify --quiet)
            mkdir "$side-crate"
            tar -xzf "$side"/target/package/*.crate -C "$side-crate" --strip-components=1
            # Not consumer-facing: VCS metadata, the raw manifest, and the lockfile (ignored by dependents).
            rm "$side-crate"/{.cargo_vcs_info.json,Cargo.toml.orig,Cargo.lock}
          done

      - name: Diff
        run: git diff --color=always --no-index --stat --patch base-crate/ pr-crate/ || true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm

      - name: Install
        run: npm ci

      - name: Run ESLint
        run: npm run lint
